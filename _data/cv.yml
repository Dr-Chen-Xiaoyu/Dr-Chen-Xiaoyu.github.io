    Projects:
      - name: Deep learning informed whole-brain modelling 
        summary: Incorporation of cortical hierarchy improves fitting of functional connectome (FC) from structural connectome (SC) using reduced Wong-Wang model. However, its necessity remains unknown due to difficulty in model training as well as limited data modality. Here, we developed a connectome-based back-propagation training procedure that enables nodal parameters to be trained independently across cortical nodes, thereby exploring nodal heterogeneity with full degrees of freedom. We then introduced effective connectome (EC) from direct electrical stimulation dataset F-TRACT, and adopted a two-step training pipeline that integrates information from both EC and FC. In the well-trained model, hierarchical specialization anatomically emerges that recurrent strength and intrinsic noise level both increase along the hierarchical axis from sensory-motor to association areas. Moreover, we found an empirical divergence that node strength of EC is positively correlated with hierarchy, whereas node strength of FC shows negative correlation. With demonstrated impact of heterogeneity of node dynamics as to modeled node strength, we finally illustrated a unique relationship between hierarchy, connectomes and model parameters. Our cross-modality work highlights the underlying organization of brain-wide dynamics, by paving the way for deep learning enforced biophysical modeling.
        highlights:
          - Deep learning
          - Whole-brian modelling
        start_date: 2023-01-01
        end_date: Present

